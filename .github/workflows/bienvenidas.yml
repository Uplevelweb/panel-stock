# Manda el PRIMER correo a quien se acaba de inscribir.
#
# POR QUE EXISTE
#   El correo diario sale una vez al dia. Sin esto, quien se inscribe a las
#   15:00 no ve nada hasta la manana siguiente: diecisiete horas de silencio
#   justo en el momento de mas entusiasmo. Y la pagina promete «tu primera
#   alerta sale en unos minutos», una promesa que hasta el 31-08-2026 el
#   sistema NO cumplia porque `alertador.py --bienvenidas` se corria a mano.
#
# EL PORTERO
#   La bodega pesa 121 MB. Bajarla 96 veces al dia para descubrir que no hay
#   nadie esperando es un desperdicio, asi que el primer paso pregunta a
#   Supabase —con un curl, sin bajar nada— si hay alguien pendiente. Si no
#   hay, la corrida termina en segundos y los demas pasos ni se ejecutan.
#
# LA MARCA DE «YA SE ENVIO»
#   Vive en `suscriptores.bienvenida_enviada` y se escribe DESPUES de que el
#   correo salio. Si el envio falla, esa persona sigue en la lista y le llega
#   en la corrida siguiente.
#
#   ⚠️ OJO CON LOS SECRETOS: si `SUPABASE_URL` o `SUPABASE_SECRET_KEY` faltan
#   o vienen mal escritos, `alertador.py` cae a su respaldo local
#   (`bienvenidas_enviadas.json`), que NO esta en el repositorio — y sin ese
#   archivo creeria que nadie ha recibido nada y le mandaria la bienvenida a
#   TODOS otra vez. Por eso el portero falla ruidosamente si los secretos no
#   estan, en vez de dejar pasar la corrida.
#
# CADA CUANTO
#   Cada 15 minutos. GitHub no garantiza la hora exacta en los repositorios
#   gratuitos y puede atrasarse; en la practica es de 15 a 30 minutos. Para
#   la feria, el boton «Run workflow» lo dispara al instante desde el
#   telefono, y esa es la via cuando alguien se inscribe parado al lado tuyo.
#
# CUESTA CERO: los repositorios publicos no pagan minutos de GitHub Actions.

name: Correos de bienvenida

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:          # y a mano, con el boton "Run workflow"

# Solo lee el repositorio: esta tarea no guarda nada de vuelta.
permissions:
  contents: read

# Dos corridas a la vez le mandarian el correo dos veces a la misma persona:
# la segunda leeria la lista antes de que la primera alcance a marcar. Con
# esto la segunda espera a que termine la primera, y entonces ya no ve a nadie.
concurrency:
  group: bienvenidas
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    # 120 paginas de API para 7 dias habiles de compras agiles: el primer
    # correo tarda varios minutos en armarse. El guardia de `concurrency`
    # evita que la corrida siguiente se le encime.
    timeout-minutes: 45

    steps:
      - name: ¿Hay alguien esperando su bienvenida?
        id: portero
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SECRET_KEY}" ]; then
            echo "::error::Falta SUPABASE_URL o SUPABASE_SECRET_KEY en los secretos."
            echo "Sin ellos alertador.py mandaria la bienvenida a TODOS de nuevo."
            exit 1
          fi
          # limit=1: solo interesa si hay alguien, no cuantos.
          consulta="${SUPABASE_URL}/rest/v1/suscriptores?select=id&activo=eq.true&bienvenida_enviada=is.null&limit=1"
          respuesta=$(curl -sS --fail-with-body -m 30 \
            -H "apikey: ${SUPABASE_SECRET_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            "${consulta}")
          if [ "${respuesta}" = "[]" ]; then
            echo "Nadie espera bienvenida. Nada que hacer."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "Hay alguien esperando. Sigo."
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Bajar el repositorio
        if: steps.portero.outputs.hay == 'si'
        uses: actions/checkout@v4

      - name: Preparar Python
        if: steps.portero.outputs.hay == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lo necesario
        if: steps.portero.outputs.hay == 'si'
        run: pip install pandas pyarrow

      - name: Mandar la bienvenida
        if: steps.portero.outputs.hay == 'si'
        env:
          TICKET_MP: ${{ secrets.TICKET_MP }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python alertador.py --bienvenidas --enviar
