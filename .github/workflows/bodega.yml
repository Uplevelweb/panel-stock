# Llena la bodega de Mercado Publico todas las madrugadas.
#
# Desde el 21-08-2026 NO usa la API orden por orden, sino los archivos de datos
# abiertos de ChileCompra (oc-da/AAAA-M.zip): un archivo por mes con TODAS las
# ordenes de Chile, actualizado a diario con un dia de desfase. Bajar 2025-2026
# entero pasa de 51 dias a menos de una hora, y ademas trae el convenio marco de
# cada orden, que la API no entrega.
#
# Corre a las 02:00 de Chile (06:00 UTC). Es gratis: los repositorios publicos no
# pagan minutos de GitHub Actions.
#
# El secreto TICKET_MP se sigue usando, pero solo para preguntar el NOMBRE de
# cada convenio (~28 consultas, una sola vez).

name: Bodega Mercado Público

on:
  schedule:
    - cron: "0 6 * * *"      # 02:00 en Chile
  workflow_dispatch:          # y tambien a mano, con el boton "Run workflow"
    inputs:
      completo:
        description: "Rehacer toda la historia desde enero 2025 (tarda ~1 hora)"
        required: false
        type: boolean
        default: false

# Permiso para que la tarea pueda guardar los datos en el repositorio.
permissions:
  contents: write

jobs:
  llenar:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lo necesario
        run: pip install pandas pyarrow

      - name: Llenar la bodega
        env:
          TICKET_MP: ${{ secrets.TICKET_MP }}
        run: |
          python bodeguero.py ${{ github.event.inputs.completo == 'true' && '--completo' || '' }}

      - name: Guardar lo descargado en el repositorio
        run: |
          git config user.name "Bodeguero"
          git config user.email "bodeguero@users.noreply.github.com"
          git add bodega
          if git diff --staged --quiet; then
            echo "No hay datos nuevos que guardar."
          else
            git commit -m "Bodega: datos al $(date -u +'%d-%m-%Y')"
            # Si alguien subio algo mientras corria, se reintenta sobre lo nuevo.
            git pull --rebase --autostash origin main || true
            git push
          fi
