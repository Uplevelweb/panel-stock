# El correo diario de oportunidades, a las 8, 13 y 18 de Chile.
#
# POR QUE EXISTE
#   Serling configuro tres horas de envio y el formulario deja elegir una de
#   ellas, pero hasta el 31-08-2026 NINGUN trabajo automatico corria
#   `alertador.py`: los tres horarios existian en la base de datos y en la
#   pagina, y no los honraba nadie. Los correos salian solo si ella los
#   mandaba a mano desde su computador.
#
# CADA QUIEN A SU HORA
#   `--hora N` manda solo a quienes pidieron recibirlo a esa hora. Sin la
#   bandera les llegaria a todos tres veces al dia.
#
# ⚠️ EL CAMBIO DE HORA DE CHILE
#   GitHub solo entiende UTC y no sabe de horarios de verano. Chile pasa de
#   UTC-4 a UTC-3 el 06-09-2026 —tres dias antes de la feria del 9 y 10—, asi
#   que las 08:00 de Chile son las 12:00 UTC hasta el dia 5 y las 11:00 UTC
#   desde el dia 6. Un cron fijo se correria una hora justo durante la feria.
#
#   Por eso hay SEIS horarios (las dos posibilidades de cada envio) y un
#   portero que le pregunta la hora real a Chile con `TZ=America/Santiago`.
#   De las seis corridas, tres se van en tres segundos sin hacer nada. Es
#   feo de leer y es lo unico que no se rompe dos veces al ano.
#
# CUESTA CERO: los repositorios publicos no pagan minutos de GitHub Actions.

name: Correo diario

on:
  schedule:
    - cron: "0 11 * * *"    # 08:00 con horario de verano (UTC-3)
    - cron: "0 12 * * *"    # 08:00 con horario de invierno (UTC-4)
    - cron: "0 16 * * *"    # 13:00 verano
    - cron: "0 17 * * *"    # 13:00 invierno
    - cron: "0 21 * * *"    # 18:00 verano
    - cron: "0 22 * * *"    # 18:00 invierno
  workflow_dispatch:
    inputs:
      hora:
        description: "Mandar a los de esta hora (8, 13 o 18)"
        required: true
        type: choice
        options: ["8", "13", "18"]
        default: "8"

permissions:
  contents: read

# Dos corridas a la vez le mandarian dos correos a la misma persona.
concurrency:
  group: correo-diario
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: ¿Qué hora es en Chile?
        id: reloj
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.hora }}" ]; then
            # Disparo a mano: manda el boton, no el reloj.
            echo "hora=${{ github.event.inputs.hora }}" >> "$GITHUB_OUTPUT"
            echo "A mano: hora ${{ github.event.inputs.hora }}."
            exit 0
          fi
          hora=$(TZ=America/Santiago date +%-H)
          case "${hora}" in
            8|13|18)
              echo "En Chile son las ${hora}:00. Toca enviar."
              echo "hora=${hora}" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "En Chile son las ${hora}:00. No es hora de envio (el otro cron del par ya corrió o correrá)."
              echo "hora=no" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Bajar el repositorio
        if: steps.reloj.outputs.hora != 'no'
        uses: actions/checkout@v4

      - name: Preparar Python
        if: steps.reloj.outputs.hora != 'no'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar lo necesario
        if: steps.reloj.outputs.hora != 'no'
        run: pip install pandas pyarrow

      - name: Mandar el correo de las ${{ steps.reloj.outputs.hora }}
        if: steps.reloj.outputs.hora != 'no'
        env:
          TICKET_MP: ${{ secrets.TICKET_MP }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python alertador.py --enviar --hora ${{ steps.reloj.outputs.hora }}
