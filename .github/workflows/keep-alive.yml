name: Mantener panel despierto
# Sin `schedule:` a propósito: lo dispara el reloj de Supabase (pg_cron),
# que sí es puntual. Un curl no sirve: Streamlit exige una sesión real.
on:
  workflow_dispatch:
concurrency:
  group: keep-alive
  cancel-in-progress: false
jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mantener_despierta.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python mantener_despierta.py
