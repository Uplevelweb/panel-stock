name: Keep Streamlit app awake

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping panel-stock-uplevel.streamlit.app
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://panel-stock-uplevel.streamlit.app/)
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Streamlit app did not return 200 (got $code)"
          fi
