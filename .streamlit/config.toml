# Tema de Uplevel Inteligencia: los mismos colores de uplevelweb.art
# —azul marino #0c2c57 y naranjo #f18c3f—. Streamlit solo lee el tema desde
# aqui, no se puede definir desde app.py.
#
# 24-09-2026, pedido de Serling: se saca el modo oscuro por completo -era un
# desorden, porque `modo_de_la_vista()` en app.py (los colores de las
# tarjetas HTML) podia caer en oscuro mientras los widgets nativos de
# Streamlit ya estaban en claro por el `base = "light"` de antes-. Ahora hay
# un solo juego de colores, siempre el mismo, sin boton para cambiarlo ni
# bloque [theme.dark]/[theme.light]. Si se cambia un color aca, cambiarlo
# tambien en el diccionario COLOR de app.py.
[theme]
primaryColor = "#d9741f"
backgroundColor = "#F2F6FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0c2c57"
font = "sans-serif"
# Un 15% mas grande que el 13 que tenia (27-08-2026: costaba leerlo). Se hace
# aqui y no con CSS para que la tabla tambien lo respete y no se rompa la seleccion.
#
# 26-09-2026, pedido de Serling: subido de 15 a 18 -un 20% mas- para que el
# tamaño de letra de "Territorio Comercial" quede proporcional al de "Panel
# Territorio" (cuyo texto de contenido usa 18px). Todo lo que en app.py esta
# en rem/em escala solo con este numero; los tamaños en px puestos a mano en
# el CSS de aplicar_estilos() se subieron ese mismo 20% a mano, para que la
# proporcion entre titulo/subtitulo/contenido no cambie, solo el tamaño.
baseFontSize = 18
