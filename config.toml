# Tema de Uplevel Inteligencia: los mismos colores de uplevelweb.art
# —azul marino #0c2c57 y naranjo #f18c3f—. Streamlit solo lee el tema desde
# aqui, no se puede definir desde app.py.
#
# Antes eran los del Panel Armada (rojo #C1303F sobre gris azulado), que son
# los de Emergenza. Se cambiaron el 27-08-2026: la app es producto de Uplevel
# y Emergenza es su cliente, no al reves. La marca de Emergenza se conserva
# donde corresponde: el PDF y el correo de cotizacion que ella le manda a la
# institucion.
[theme]
base = "dark"
primaryColor = "#f18c3f"
backgroundColor = "#0c2c57"
secondaryBackgroundColor = "#123a6e"
textColor = "#EAF1F8"
font = "sans-serif"

# Un 15% mas grande que el 13 que tenia (27-08-2026: costaba leerlo). Se hace
# aqui y no con CSS para que la tabla tambien lo respete y no se rompa la seleccion.
baseFontSize = 15
